<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Products</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #faf9fa;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 15px;
      text-align: center;
    }
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 6px;
      background: #e74c3c;
    }
    .card h2 {
      font-size: 14px;
      margin: 10px 0 5px;
    }
    .card p {
      margin: 4px 0;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Our Products</h1>
  <div class="container"></div>

  <script>
    const movies = [
    {
        title: "Avengers: Endgame",
        year: 2019,
        genre: "Action",
        rating: 8.4,
        duration: "181 min",
        poster: "https://unsplash.com/photos/a-close-up-of-a-hand-with-a-light-on-it-rkaahInFlBg"
    },
    {
        title: "Interstellar",
        year: 2014,
        genre: "Sci-Fi",
        rating: 8.7,
        duration: "169 min",
        poster: "https://images.unsplash.com/photo-1640499900704-b00dd6a1103a?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8YXZlbmdlcnxlbnwwfHwwfHx8MA%3D%3D"
    },
    {
        title: "3 Idiots",
        year: 2009,
        genre: "Comedy",
        rating: 8.4,
        duration: "170 min",
        poster: "https://images.unsplash.com/photo-1608889476561-6242cfdbf622?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8YmF0bWFuJTIwd2l0aCUyMGlyb24lMjBtYW4lMjBhbmQlMjBzcGlkZXJtYW58ZW58MHx8MHx8fDA%3D"
    }
];

    const container = document.querySelector(".container");

    movies.map(item => {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <img src="${item.poster}" alt="${item.title}">
        <h2>${item.title}</h2>
        <p>Year: ${item.year}</p>
        <p>Genre: ${item.genre}</p>
        <p>Rating: ${item.rating}</p>
        <p>Duration: ${item.duration}</p>
      `;
      container.appendChild(div);
    });
  </script>
</body>
</html>
