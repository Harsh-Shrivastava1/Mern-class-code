<!DOCTYPE html>
<html>
<head>
  <title>Login Page</title>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>
    <form onsubmit="return validateForm()">
      <input type="text" id="name" placeholder="Name Please..hehe👀">
      <input type="email" id="email" placeholder="Email (Eyes open)🫣">
      <input type="password" id="password" placeholder="Password (Eyes closed)🙈">
      <button type="submit">Submit</button>
    </form>
  </div>

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #eee;
      font-family: sans-serif;
    }
    .login-box {
      background: #fff;
      padding: 20px;
      border: 1px solid #000;
      width: 250px;
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 15px;
    }
    .login-box input {
      width: 90%;
      margin: 5px 0;
      padding: 8px;
      border: 1px solid #000;
    }
    .login-box button {
      width: 97.28%;
      padding: 8px;
      background: green;
      color: #fff;
      border: none;
    }
  </style>

  <script>
    function validateForm() {
      let name = document.getElementById("name").value;
      let email = document.getElementById("email").value;
      let password = document.getElementById("password").value;

      if (name === "" || email === "" || password === "") {
        alert("Fill all fields");
        return false;
      }
      if (password.length < 5) {
        alert("Password must be at least 5 characters");
        return false;
      }
      alert("Form submitted!");
      return true;
    }
  </script>
</body>
</html>
