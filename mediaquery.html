<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Landing Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#fff;
    overflow:hidden;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 60px;
    background:#fff;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#333;
}

nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin-left:20px;
}

nav ul li a{
    text-decoration:none;
    color:#333;
    font-size:16px;
}

nav ul li a:hover{
    color:#007bff;
}

.hero{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:180px 60px;
    
}

.hero-text{
    flex:1;
}

.hero-text h1{
    font-size:45px;
    color:#222;
    margin-bottom:15px;
}

.hero-text p{
    font-size:16px;
    color:#555;
    max-width:400px;
    margin-bottom:20px;
    line-height:1.4;
}

.btn{
    display:inline-block;
    padding:10px 20px;
    background:#007bff;
    color:#fff;
    text-decoration:none;
    border-radius:5px;
    transition:.3s;
}

.btn:hover{
    background:#0056b3;
}

.hero-image{
    flex:1;
    text-align:right;
}

.hero-image img{
    width:500px;
    max-width:100%;
    border-radius:10px;
}

@media (max-width:768px){
    .hero{
        flex-direction:column;
        text-align:center;
        padding:60px 20px;
    }
    .hero-image{
        margin-top:30px;
        text-align:center;
    }
    .hero-image img{
        width:350px;
    }
}

@media (max-width:480px){
    .hero{
        padding:40px 20px;
    }
    .hero-image img{
        width:250px;
    }
}
</style>
</head>
<body>

<nav>
    <div class="logo">MyBrand</div>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<section class="hero">
    <div class="hero-text">
        <h1>Learn Responsive Web Design</h1>
        <p>Build websites that work beautifully on every device.</p>
        <a href="#" class="btn">Get Started</a>
    </div>
    <div class="hero-image">
        <img src="https://images.unsplash.com/photo-1780498178879-4064b19e6517?w=600&auto=format&fit=crop&q=60" alt="Web Design">
    </div>
</section>

</body>
</html>
