<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Text Manipulator</title>
    <link rel="stylesheet" href="newsite.css">
</head>
<body>
    <div class="container">
        <h1>Interactive Text Manipulator</h1>
        <input type="text" id="inputText" placeholder="Type">
        <p id="output">Your text will appear here.</p>
        <div class="buttons">
            <button id="showBtn">Show Text</button>
            <button id="clearBtn">Clear</button>
            <button id="upperBtn">Uppercase</button>
            <button id="highlightBtn">Toggle Highlight </button>
        </div>
    </div>
    <script src="newsite.js"></script>
</body>
</html>
