<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Window and Div Scroll Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      height: 2000px;
      background: #f5f5f5;
    }

    .fixed-box {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #222;
      color: white;
      padding: 12px 16px;
      border-radius: 8px;
      width: 220px;
    }

    .scroll-box {
      width: 300px;
      height: 180px;
      overflow: auto;
      border: 2px solid #333;
      background: white;
      padding: 10px;
      margin-top: 100px;
    }

    .content {
      height: 600px;
      background: linear-gradient(#dff, #fdd, #dfd);
    }
  </style>
</head>
<body>

  <div class="fixed-box">
    <div id="pageScrollText">Page scroll: 0</div>
    <div id="divScrollText">Div scroll: 0</div>
  </div>

  <h1>Scroll Demo</h1>
  <p>Scroll the page or the box below.</p>

  <div id="scrollBox" class="scroll-box">
    <div class="content">
      <h3>Scrollable Div</h3>
      <p>Keep scrolling inside this box...</p>
      <p>ABCD</p>
      <p>EFGH</p>
      <p>IJKL</p>
      <p>MNOP</p>
      <p>QRST</p>
      <p>UVWX</p>
      <p>YZ</p>
    </div>
  </div>
  <script>
        const pageScrollText = document.getElementById("pageScrollText");
        const divScrollText = document.getElementById("divScrollText");
        const scrollBox = document.getElementById("scrollBox");

        window.addEventListener("scroll", function () {
        pageScrollText.textContent = "Page scroll: " + window.scrollY + " px";
        });

        scrollBox.addEventListener("scroll", function () {
        divScrollText.textContent = "Div scroll: " + scrollBox.scrollTop + " px";
        });
  </script>
</body>
</html>
