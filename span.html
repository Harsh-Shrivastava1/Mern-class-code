<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout 1</title>
    <style>
         *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .main-container{
            background-color: rgb(231, 231, 231);
            margin: 10px;
            border-radius: 10px;
        }

        .container{
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 4px solid rgb(42, 41, 41);

            display: grid;
            grid-gap: 4px;

            grid-template-columns: 1fr 3fr;
            grid-template-rows: 100px 100px 100px;
            grid-template-areas: 'header header'
            'main aside'
            'footer footer';

            color: white;
        }

        .item{
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
        }

        .item-1{
            border: 4px solid red;
            background-color: rgb(251, 96, 96);
            grid-area: header;
        }
        .item-2{
              border: 4px solid blue;
            background-color: rgb(114, 114, 255);
            grid-area: main;
        }
        .item-3{
              border: 4px solid green;
            background-color: rgb(100, 243, 100);
            grid-area: aside;
        }
        .item-4{
              border: 4px solid rgb(206, 183, 9);
            background-color: rgb(245, 245, 106);
            grid-area: footer;
        }

    </style>
</head>
<body>
    <div class="main-container">
        <div class="container">
            <div class="item item-1">header</div>
            <div class="item item-2">main</div>
            <div class="item item-3">aside</div>
            <div class="item item-4">footer</div>
        </div>
    </div>
</body>
</html>
