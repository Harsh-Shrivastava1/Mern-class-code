<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover</title>
    <style>
         body {
            margin: 0;
            height: 100vh; 
            display: flex;
            align-items: center; 
            justify-content: center; 
        }
        .box{
            width:150px;
            height:150px;
            background:rgb(234, 0, 0);
            display:flex;
            justify-content:center;
            align-items:center;
            border-radius:10px;
            transition:transform 0.8s ease;
        }
        .box:hover{
            transform: scale(1) rotate(360deg);
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
